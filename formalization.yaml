# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Candidate metadata: use project.license only with a matching root LICENSE.
version: "v0.4"

project:
  name: "The optimal planar torsion gradient"
  description: >-
    A substantive Lean development of the sharp torsion-gradient bound for
    nonempty bounded open convex planar domains, its exact spectral constant,
    and attainment by the area-normalized second-eigenfunction Cauchy image.
  authors:
    - "Caden Young"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Caden Young"

# This repository contains the substantive proof development, not a thin
# wrapper around a separate repository; repository is therefore omitted.

classification:
  arxiv: ["math.AP", "math.OC"]
  msc2020: ["49Q10", "35J25", "35R11"]

sources:
  - title: "An exact spectral construction for the optimal planar torsion gradient"
    authors:
      - "Caden Young"
    type: "unpublished manuscript"
    location: "Theorem 1.1; Sections 2-5; Appendix A"
    relationship: "formalizes"
    note: >-
      Manuscript dated 30 October 2026, not peer-reviewed. The formalized core
      is the sharp inequality, exact spectral value, and attainment. The
      manuscript's uniqueness theorem and the concrete marked-flux deficit
      corollary have the qualifications recorded under status and fidelity.
      The manuscript discloses AI assistance.
    license: "unknown"

related_formalizations: []

status:
  scope: >-
    The core result applies to the original nonempty bounded open convex
    planar class, with zero-Dirichlet weak torsion, ordinary planar Lebesgue
    area, and the interior essential supremum of the genuine weak gradient.
    Torsion.second_exact_value proves the exact area-one supremum and
    attainment by the specified normalized Cauchy image without mathematical
    proof parameters. The universal inequality is proved in
    Torsion.DirichletTheory.G_le_second_spectral_bound. Uniqueness of all
    maximizing domains is outside the current Lean final theorem. General
    Hilbert-space radial deficit identities have explicit calibration and
    Euler premises; the source has no separate declaration of the paper's
    concrete marked-flux corollary verbatim. Full gradient-functional
    stability, perimeter normalization, and higher-dimensional extensions
    are not claimed. The historical v8 source reports 392 mathematical
    modules, 52713 lines, and an audit of 3587 theorem declarations. The
    original Lean 4.19 baseline at commit
    a4fe19c71d4ac5ffbd85fc9d2f013a0c7b1a5e4b passed its full GitHub build,
    3587-theorem axiom audit, and aggregate submission wrapper in run
    41132349657; the wrapper also uses only the permitted three axioms.
    The current compatibility branch genuinely targets Lean 4.35.0-rc2 and
    mathlib commit 065356127b1dc0016f66b7283ce0ce2c4055aa55, with all
    transitive dependencies pinned. It ports module visibility metadata
    and mathlib APIs while preserving headline statements and original
    mathematical objects. One auxiliary convergence lemma now takes explicit
    measurability proofs, discharged at its original callers without adding
    headline hypotheses. The full local build, complete 4201-theorem audit
    across all 393 project modules, and aggregate submission proof passed.
    The exact-commit official sandboxed Comparator result with NanoDa and
    con-ron is reported separately by GitHub Actions and Principia. The passing Lean 4.19 main
    baseline is preserved while the compatibility branch is validated.
  # Counts describe the recorded proof development and exclude only the
  # intentional reference-theorem placeholder in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: []
      framework: "ChatGPT"
      tool_setup: >-
        Human-directed ChatGPT assistance in mathematical development,
        manuscript preparation, numerical checks, Lean formalization, and
        repository packaging. The development uses Lean and mathlib. The
        current compatibility work ports the source to Lean 4.35.0-rc2,
        including module visibility metadata and changed mathlib APIs.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not fully recorded"
      prompting_notes: >-
        Iterative instructions to formalize the torsion-gradient result,
        preserve the existing source, discharge remaining analytic inputs,
        and check the theorem statements and axiom dependencies.
  spend_usd: "not tracked"
  notes: >-
    AI assistance is disclosed. Exact historical model identifiers and a
    complete usage ledger were not recorded, so the empty models list does
    not mean no AI was used. Repository and metadata preparation do not
    themselves establish mathematical correctness or Comparator success.

fidelity:
  divergences: >-
    The formalized core matches the sharp-bound, exact-value, and attainment
    scope of Theorem 1.1. The shorter manuscript uses existing spectral and
    boundary-attainment results; the formal development constructs its
    required inputs independently. The manuscript's Theorem 1.2 uniqueness
    classification is not included in the current final Lean theorem.
    Its concrete marked-flux deficit corollary is an application of the
    proved calibration to general formal identities, not a separate concrete
    source declaration. Floating-point numerical illustrations are not
    certified decimal enclosures and are not used as premises of the core.
    The Lean 4.35 port adds explicit measurability arguments to the auxiliary
    tendsto_eLpNorm_lipschitz_comp lemma because mathlib changed eLpNorm for
    nonmeasurable functions. Both original Sobolev callers discharge these
    arguments from existing facts; their headline statements are unchanged.

review:
  status: "Lean 4.35 full local build and complete axiom audit passed; external CI tracked separately"
  reviewers: []
  notes: >-
    ChatGPT performed source-level checks of the final theorem types, key
    definitions, import dependencies, and documented verification scope.
    GitHub run 41132349657 passed the complete build, original theorem
    audit, and aggregate submission wrapper at baseline commit
    a4fe19c71d4ac5ffbd85fc9d2f013a0c7b1a5e4b on Lean 4.19. Both axiom
    checks allow only propext, Classical.choice, and Quot.sound. The current
    Lean 4.35.0-rc2 port passed its complete local build and audit of 4201
    project theorem roots, including private/generated declarations and
    backports. Its submission proof also passed the permitted-axiom check.
    Exact-commit sandboxed Comparator replay through Lean, NanoDa, and
    con-ron is reported separately in external CI. The official bundled Comparator workflow is
    configured separately from ordinary build/audit CI. No independent
    expert peer review, author verification of every proof, or Comparator
    pass is claimed.

alignment:
  namespace: "Torsion"
  statements:
    - source: "Theorem 1.1: sharp inequality on every admissible convex domain"
      lean: "Torsion.DirichletTheory.G_le_second_spectral_bound"
      module: "Torsion.CanonicalUniversal"
      status: "Lean 4.35 full local build and axiom audit passed; external CI tracked separately"
      note: "Uses the actual weak-gradient norm and original convex-domain class."
    - source: "Theorem 1.1: exact optimal constant and normalized-image attainment"
      lean: "Torsion.second_exact_value"
      module: "Torsion.CanonicalOptimization"
      status: "Lean 4.35 full local build and axiom audit passed; external CI tracked separately"
      note: "No mathematical proof parameters remain in this final theorem."
    - source: "Combined submission claim for Theorem 1.1"
      lean: "TorsionSubmission.solution"
      module: "Solution"
      status: "Lean 4.35 submission proof and axiom audit passed; external CI tracked separately"
      note: >-
        Combines the universal bound, exact cStar, and area-one normalized
        Cauchy-image attainment. Challenge contains only its
        deliberate reference proof placeholder; Claim remains a concrete
        definition, not a permitted definition hole.

acknowledgements: >-
  Lean, mathlib and their contributors; ChatGPT assistance as described above.
