# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Candidate metadata: use project.license only with a matching root LICENSE.
version: "v0.4"

project:
  name: "The optimal planar torsion gradient"
  description: >-
    A substantive Lean development of the sharp torsion-gradient bound for
    nonempty bounded open convex planar domains, its exact spectral constant,
    and classification of every equality case as a similarity of the normalized Cauchy image.
  authors:
    - "Caden Young"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Caden Young"

# This repository contains the substantive proof development, not a thin
# wrapper around a separate repository; repository is therefore omitted.

classification:
  arxiv: ["math.AP", "math.OC"]
  msc2020: ["49Q10", "35J25", "35R11"]

sources:
  - title: "An exact spectral construction for the optimal planar torsion gradient"
    authors:
      - "Caden Young"
    type: "unpublished manuscript"
    location: "Theorems 1.1 and 1.2, supporting results, and computational formulas"
    relationship: "formalizes"
    note: >-
      The 18 November 2026 manuscript credits AI assistance. A section-by-section
      correspondence with the Lean development is given in validation/PAPER_COVERAGE.md.
    license: "unknown"

related_formalizations: []

status:
  scope: >-
    TorsionSubmission.paperTheorems proves both main theorems for the weak
    Dirichlet solution, planar Lebesgue area and the actual essential supremum
    of its weak gradient. Equality holds exactly on the similarities of the
    area-normalized Cauchy image of the second restricted eigenfunction.
    Supporting results include attainment of a fixed boundary quotient on
    every convex competitor, radial calibration and its deficit, the physical
    first variations, disk and ellipse benchmarks, and the exact finite
    Galerkin mass and energy matrices. The project is pinned to Lean 4.35.0-rc2
    and mathlib 065356127b1dc0016f66b7283ce0ce2c4055aa55.
  # Counts describe the recorded proof development and exclude only the
  # intentional reference-theorem placeholder in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: []
      framework: "ChatGPT"
      tool_setup: >-
        Human-directed ChatGPT assistance in mathematical development,
        manuscript preparation, numerical checks, Lean formalization, and
        repository packaging. The development uses Lean and mathlib. The
        current compatibility work ports the source to Lean 4.35.0-rc2,
        including module visibility metadata and changed mathlib APIs.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not fully recorded"
      prompting_notes: >-
        Iterative instructions to formalize the torsion-gradient result,
        preserve the existing source, discharge remaining analytic inputs,
        and check the theorem statements and axiom dependencies.
  spend_usd: "not tracked"
  notes: >-
    AI assistance is disclosed. Exact historical model identifiers and a
    complete usage ledger were not recorded, so the empty models list does
    not mean no AI was used. Repository and metadata preparation do not
    themselves establish mathematical correctness or Comparator success.

fidelity:
  divergences: >-
    The development constructs the one-dimensional spectral input directly.
    It derives fixed boundary attainment by a harmonic rectangle comparison.
    Global rigidity follows from compactness of supporting frames and the
    calibrated deficit. The numerical Poisson and Galerkin tables are
    floating-point experiments. See validation/PAPER_COVERAGE.md for the
    exact benchmark inequalities checked in Lean.

review:
  status: "Kernel checks, full declaration audit, and separate exact-commit Comparator workflow"
  reviewers: []
  notes: >-
    Audit.lean inspects all project declarations including private and generated
    declarations. Challenge.lean contains the isolated Comparator reference.
    GitHub Actions records the clean rebuild, axiom audit, and independent
    kernel replays for each submitted revision.

alignment:
  namespace: "Torsion"
  statements:
    - source: "Theorem 1.1: sharp inequality on every admissible convex domain"
      lean: "Torsion.DirichletTheory.G_le_second_spectral_bound"
      module: "Torsion.CanonicalUniversal"
      status: "Lean 4.35 full local build and axiom audit passed; external CI tracked separately"
      note: "Uses the actual weak-gradient norm and original convex-domain class."
    - source: "Theorem 1.1: exact optimal constant and normalized-image attainment"
      lean: "Torsion.second_exact_value"
      module: "Torsion.CanonicalOptimization"
      status: "Lean 4.35 full local build and axiom audit passed; external CI tracked separately"
      note: "No mathematical proof parameters remain in this final theorem."
    - source: "Theorem 1.2, equality if and only if similarity"
      lean: "Torsion.second_sharp_equality_iff_similarity"
      module: "Torsion.Proof.PaperUniqueness"
      status: "Proved"
    - source: "Both main theorems, including conformality, image area and midpoint slope"
      lean: "TorsionSubmission.paperTheorems"
      module: "Solution"
      status: "Proved"
    - source: "Combined submission claim for Theorem 1.1"
      lean: "TorsionSubmission.solution"
      module: "Solution"
      status: "Lean 4.35 submission proof and axiom audit passed; external CI tracked separately"
      note: >-
        Combines the universal bound, exact cStar, and area-one normalized
        Cauchy-image attainment. Challenge contains only its
        deliberate reference proof placeholder; Claim remains a concrete
        definition, not a permitted definition hole.

    - source: "Concrete marked radial deficit and planar symmetric-difference corollary"
      lean: "Torsion.Spectral.second_marked_area_one_symmDiff_deficit"
      module: "Torsion.CanonicalRadialStability"
      status: "Full local build and recursive axiom audit passed; external CI tracked separately"
      note: "Uses genuine planar area and the actual normalized Cauchy image; fixes the mark."
    - source: "Equality in the area-one marked radial class"
      lean: "Torsion.Spectral.second_marked_area_one_domain_rigidity"
      module: "Torsion.CanonicalRadialStability"
      status: "Full local build and recursive axiom audit passed; external CI tracked separately"
      note: "Identifies the domain in the fixed marked coordinates."
    - source: "Supporting radial outer observation for the full weak-gradient norm"
      lean: "Torsion.DirichletTheory.exists_supporting_positive_radial_flux_gt"
      module: "Torsion.CanonicalGradientStability"
      status: "Full local build and recursive axiom audit passed; external CI tracked separately"
      note: "Any strict lower threshold is exceeded on a convex positive radial outer domain."

acknowledgements: >-
  Lean, mathlib and their contributors; ChatGPT assistance as described above.
