name: Lean build and axiom audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check verified toolchain and mathlib pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path('lean-toolchain').read_text().strip() == 'leanprover/lean4:v4.35.0-rc2'
          manifest = json.loads(Path('lake-manifest.json').read_text())
          mathlib = next(package for package in manifest['packages'] if package['name'] == 'mathlib')
          assert mathlib['rev'] == '065356127b1dc0016f66b7283ce0ce2c4055aa55'
          PY

      - name: Build the complete Lean library
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Check canonical dependency imports
        run: python3 scripts/check-mathlib-imports.py

      - name: Run the complete project theorem axiom audit
        run: lake env lean Audit.lean

      - name: Check the concrete submission statement and proof
        shell: bash
        run: |
          lake build SubmissionStatement Challenge Solution
