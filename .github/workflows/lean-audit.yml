name: Lean build and axiom audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check verified toolchain and mathlib pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path('lean-toolchain').read_text().strip() == 'leanprover/lean4:v4.35.0-rc2'
          manifest = json.loads(Path('lake-manifest.json').read_text())
          mathlib = next(package for package in manifest['packages'] if package['name'] == 'mathlib')
          assert mathlib['rev'] == '065356127b1dc0016f66b7283ce0ce2c4055aa55'
          PY

      - name: Check source requirements and complete audit coverage
        run: python3 scripts/check-lean-sources.py

      - name: Install the pinned toolchain and dependency cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Rebuild all project sources and audit every declaration
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify-clean.sh 2>&1 | tee "$RUNNER_TEMP/lean-audit.log"

      - name: Preserve the clean build and audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lean-audit-log
          path: ${{ runner.temp }}/lean-audit.log
          if-no-files-found: ignore
          retention-days: 30
